[workspace]
members = ["engine"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["MarketMarkovNet Contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# native-tls lets reqwest use the OS CA bundle (Debian's /etc/ssl/certs in
# the runtime image). Without it, rustls-tls ships Mozilla's webpki-roots
# only, and FRED's Akamai edge has been observed to hang the TLS handshake
# at 30s on cold connections. native-tls is a tiny additive feature.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "native-tls"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
futures = "0.3"
zeromq = "0.6"
tower-http = { version = "0.6", features = ["cors", "fs"] }
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
rhai = "1"
uuid = { version = "1", features = ["v4"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
